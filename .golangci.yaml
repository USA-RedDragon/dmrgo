version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goheader
    - gomoddirectives
    - gosec
    - grouper
    - loggercheck
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - reassign
    - revive
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # A dmr:variant or dmr:get directive names a method and then its type,
      # which are often the same word.
      - linters:
          - dupword
        source: "^//dmr:"
      # Tests use math/rand, narrowing conversions of bounded loop values,
      # repeated literal test vectors, and fixtures in package variables that
      # they only read.
      # rxsweep runs the test binaries that it builds and the -m4 command
      # that its user names, on paths under its -out directory.
      - path: cmd/rxsweep/(run|space)\.go$
        linters:
          - gosec
        text: ^G(204|703)
      - path: _test\.go
        linters:
          - dogsled
          - gochecknoglobals
          - goconst
          - gosec
      # dvsisim is a fixture of the tests, like the _test.go files.
      - path: v2/internal/dvsisim/
        linters:
          - gosec
      # text.Int converts the magnitude of a negative int64, which uint64
      # always holds.
      - path: v2/internal/text/text\.go$
        linters:
          - gosec
        text: ^G115
      # The fixed-point receiver of Tier 0 narrows values whose range its
      # levels, rings and saturations bound; a check on each conversion
      # would cost cycles of its 4 MHz budget on a Cortex-M4F.
      - path: v2/rf/(lean|leanfec|leanfront|discrx|discfront|iqdisc|iq0front|iqlow|iqdsp|lagtab|audio|audiorate0|frontend|iqformat)\.go$
        linters:
          - gosec
        text: ^G115
      # run96 is the 9.6 kHz loop of the audio front end of Tier 0 in one
      # function, so that its state stays in registers on a Cortex-M4F; a
      # call per branch would cost cycles of its 4 MHz budget.
      - path: v2/rf/discrx\.go$
        linters:
          - gocyclo
        text: run96
      # The fixed-point modulators of Tier 0 narrow values whose range the
      # pulse tables and the phase accumulator bound; a check on each
      # conversion would cost cycles of the 4 MHz budget of a Cortex-M4F.
      - path: v2/internal/fsktx/(mcu|mcuiq|host)\.go$
        linters:
          - gosec
        text: ^G115
      # rftx simulates channel noise, which needs reproducible seeds, not
      # secure randomness.
      - path: v2/internal/rftx/channel\.go$
        linters:
          - gosec
        text: ^G404
      # rxaudio, txaudio and txiq keep the receiver or the modulator in
      # static memory, which is the point of the examples.
      - path: v2/examples/(rxaudio|txaudio|txiq)/main\.go$
        linters:
          - gochecknoglobals
      # texttest fills test values from math/rand, for tests only.
      - path: v2/internal/text/texttest/
        linters:
          - gosec
        text: ^G404
      # Read-only lookup tables of enum values and bit positions, which Go
      # cannot declare as constants.
      - path: v2/(enums/sync_patterns|layer2/cach_interleave|layer2/decode_options|layer2/framer/framer|layer2/short_lc_cach)\.go$
        linters:
          - gochecknoglobals
        text: ^(syncPatterns|cachDeinterleaveTable|cachInterleaveTable|allSyncPatterns|voiceSyncPatterns|dataSyncPatterns|shortLCFragmentLCSS) is a global variable
      # The read-only tables of the Jacobian correction of logAdd and its
      # slope.
      - path: v2/rf/exact\.go$
        linters:
          - gochecknoglobals
        text: ^(jacobian|jacobianSlope) is a global variable
      # The read-only tables of the Tier 0 receiver: the SYNC distances per
      # nibble, the Lagrange weights of the strobes, and the reciprocals
      # and arctangents of the I/Q front.
      - path: v2/rf/(lean|lagtab|iqlow)\.go$
        linters:
          - gochecknoglobals
        text: ^(syncNib|lagrangeTab|iqLowRecip64|iqLowAtan64|iqLowAtan|iqLowTab) is a global variable
      # The read-only fix positions of the Hamming codes of BPTC(196,96).
      - path: v2/internal/fec/bptc/bptc_196_96\.go$
        linters:
          - gochecknoglobals
        text: ^(h139Fix|h1511Fix) is a global variable
      # libcodec2 keeps process-wide state that one mutex guards.
      - path: v2/vocoder/codec2/codec2_cgo\.go$
        linters:
          - gochecknoglobals
        text: ^libMu is a global variable
      # The WebAssembly backend compiles the embedded module once, in one
      # wazero runtime, for every Codec of the process.
      - path: v2/vocoder/codec2/(wasmcodec|engine_wazero)\.go$
        linters:
          - gochecknoglobals
        text: ^(embedded|sharedRuntime) is a global variable
      # PCM samples cross into the module memory as the bits of each int16.
      - path: v2/vocoder/codec2/wasmcodec\.go$
        linters:
          - gosec
        text: ^G115.*(int16 -> uint16|uint16 -> int16)
      # Read-only static values that a call returns or points to, so that it
      # does not allocate: the zero options and response data for a nil
      # argument.
      - path: v2/(layer2/voice_transmitter_options|layer2/packet/response)\.go$
        linters:
          - gochecknoglobals
        text: ^(noVoiceTransmitterOptions|noResponseData) is a global variable
      # joinColorCode tells the static decode errors apart by identity:
      # errors.Is would reach a type assertion of the runtime, whose cache
      # allocates.
      - path: v2/layer2/errors\.go$
        linters:
          - errorlint
        text: ^(type assertion on error|switch on an error)
      # The generator's codec and CRC lookup tables.
      - path: cmd/dmrgen/(emit/emit|parse/parse)\.go$
        linters:
          - gochecknoglobals
        text: ^(crcAlgorithms|fecCodecs|CRCWidths) is a global variable
      # speccheck runs go test with test names from spec_matrix.yaml, and
      # rxbench runs the dmrrf sweep and writes README.md under the root.
      - path: cmd/(speccheck|rxbench)/main\.go$
        linters:
          - gosec
        text: G204|G703
      # testing.AllocsPerRun panics in a parallel test, and a
      # runtime.MemStats delta counts every test that runs at the same time.
      - path: (_alloc_test|layer2/pdu/fuzz_tinygo_test)\.go$
        linters:
          - paralleltest
        text: ^Function Test(Allocs\w*|TinyGo(Allocs|CallerStorage)|FuzzSeeds) missing the call to method parallel
      - path: (v2/(capi|internal/digest/xcrypto)|examples/(udp|tcp))/go\.mod$
        linters:
          - gomoddirectives
        text: local replacement
      - path: v2/capi/abi[23]?\.go$
        linters:
          - gocritic
        text: ^dupSubExpr
      # //go:section is a TinyGo directive that puts the hot receiver
      # loops in their own linker sections.
      - path: v2/rf/(lean|discrx|iqlow)\.go$
        linters:
          - gocheckcompilerdirectives
        text: "compiler directive unrecognized: //go:section"
      # fixBPTC is one hot loop of the Tier 0 receiver, tuned for TinyGo
      # -opt z; split, it costs cycles on the Cortex-M4F.
      - path: v2/rf/leanfec\.go$
        linters:
          - gocyclo
        text: \(\*leanCore\)\.fixBPTC
      # testing.AllocsPerRun counts the allocations of every goroutine.
      # The table of the Tier 0 audio resampler, which the TinyGo build
      # does not use.
      - path: v2/rf/tables_gen\.go$
        linters:
          - unused
        text: ^var audioUpTable is unused
      - path: v2/rf/monitor_test\.go$
        linters:
          - paralleltest
        text: ^Function TestMonitorAllocs missing the call to method parallel
      # Lookup tables of the FEC decoders and the transmitter, which TinyGo
      # keeps in flash.
      - path: v2/internal/(fec/golay/golay_(20_8_7|24_12_8)|fec/quadraticresidue/quadratic_residue_16_7_6|fsktx/mcu|fsktx/shapepred)\.go$
        linters:
          - gochecknoglobals
        text: ^(rows2087|rows24|cols24|rows|code5|predPulse) is a global variable
      # NewAudio and NewIQ check every field of their config in one place,
      # and fitKern is the long fit of a test.
      - path: v2/internal/fsktx/(host\.go|shapefit_test\.go)$
        linters:
          - gocyclo
          - unparam
        text: (NewAudio|NewIQ|fitKern)
      # The no-panic test walks every kind of reflect value in one switch.
      - path: v2/internal/allocgate/allapi/nopanic_test\.go$
        linters:
          - gocyclo
        text: (nopanicGen\)\.fill|TestNoPanic)
      # nilguard gives each String method of a nil pointer the text <nil>.
      - path: v2/
        linters:
          - goconst
        text: "^string `<nil>` has"
      # Inbound runs the access rules, the channel authorization and the
      # nil burst of one transport frame in one place, and the test edits
      # every field of an LC.
      - path: v2/(bs/repeater\.go|layer2/pdu/lc_bytes_test\.go)$
        linters:
          - gocyclo
        text: (\(\*Repeater\)\.Inbound|TestLCBytes_EditsKeepOtherBits)
      # Apply walks every declaration kind of a file in one pass.
      - path: cmd/dmrgen/nilguard/nilguard\.go$
        linters:
          - gocyclo
        text: \(\*Guard\)\.Apply
      # Every method of a session machine that appends outputs takes the
      # time now, also when it does not read it, so that all have one shape.
      - path: v2/transport/(dmrd/dmrdsession|ipsc/ipscsession)/
        linters:
          - revive
        text: "^unused-parameter: parameter 'now' seems to be unused"
      # The discriminator phase stage and the audio Tier 3 union run only
      # in builds without the tinygo tag.
      - path: v2/rf/(disccoh|discsoft_tinygo|ext)\.go$
        linters:
          - unused
        text: ^(func \(\*discPhase\)\.\w+|func (lazyDT|newDiscPhase)|field (last|out|union)|type discUnion) is unused
      # symQ is called from the Thumb-2 build of iqlowhalf_dsp.go only.
      - path: v2/rf/lean\.go$
        linters:
          - unused
        text: ^func symQ is unused
      # jennifer's DSL is written with a dot import.
      - path: cmd/dmrgen/emit/
        linters:
          - revive
          - staticcheck
        text: should not use dot imports
    paths:
      - third_party$
      - builtin$
formatters:
  enable:
    - gci
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
