version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goheader
    - gomoddirectives
    - gosec
    - grouper
    - loggercheck
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - reassign
    - revive
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests use math/rand, narrowing conversions of bounded loop values,
      # repeated literal test vectors, and fixtures in package variables that
      # they only read.
      - path: _test\.go
        linters:
          - dogsled
          - gochecknoglobals
          - goconst
          - gosec
      # dvsisim is a fixture of the tests, like the _test.go files.
      - path: v2/internal/dvsisim/
        linters:
          - gosec
      # text.Int converts the magnitude of a negative int64, which uint64
      # always holds.
      - path: v2/internal/text/text\.go$
        linters:
          - gosec
        text: ^G115
      # texttest fills test values from math/rand, for tests only.
      - path: v2/internal/text/texttest/
        linters:
          - gosec
        text: ^G404
      # Read-only lookup tables of enum values and bit positions, which Go
      # cannot declare as constants.
      - path: v2/(enums/sync_patterns|layer2/cach_interleave|layer2/decode_options|layer2/framer/framer|layer2/short_lc_cach)\.go$
        linters:
          - gochecknoglobals
        text: ^(syncPatterns|cachDeinterleaveTable|cachInterleaveTable|allSyncPatterns|voiceSyncPatterns|dataSyncPatterns|shortLCFragmentLCSS) is a global variable
      # The codec registry is process-wide, like the database/sql driver
      # registry, and libcodec2 keeps process-wide state that one mutex guards.
      - path: v2/vocoder/(codec\.go|codec2/codec2_cgo\.go)$
        linters:
          - gochecknoglobals
        text: ^(codecs is a global variable|libMu is a global variable)
      # Read-only static values that a call returns or points to, so that it
      # does not allocate: the zero options and response data for a nil
      # argument.
      - path: v2/(layer2/voice_transmitter_options|layer2/packet/response)\.go$
        linters:
          - gochecknoglobals
        text: ^(noVoiceTransmitterOptions|noResponseData) is a global variable
      # joinColorCode tells the static decode errors apart by identity:
      # errors.Is would reach a type assertion of the runtime, whose cache
      # allocates.
      - path: v2/layer2/errors\.go$
        linters:
          - errorlint
        text: ^(type assertion on error|switch on an error)
      # The generator's codec and CRC lookup tables.
      - path: cmd/dmrgen/(emit/emit|parse/parse)\.go$
        linters:
          - gochecknoglobals
        text: ^(crcAlgorithms|fecCodecs|CRCWidths) is a global variable
      # speccheck runs go test with test names from spec_matrix.yaml.
      - path: cmd/speccheck/main\.go$
        linters:
          - gosec
        text: G204|G703
      # testing.AllocsPerRun panics in a parallel test.
      - path: _alloc_test\.go$
        linters:
          - paralleltest
        text: ^Function TestAllocs\w* missing the call to method parallel
      - path: v2/capi/go\.mod$
        linters:
          - gomoddirectives
        text: local replacement
      # jennifer's DSL is written with a dot import.
      - path: cmd/dmrgen/emit/
        linters:
          - revive
          - staticcheck
        text: should not use dot imports
    paths:
      - third_party$
      - builtin$
formatters:
  enable:
    - gci
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
