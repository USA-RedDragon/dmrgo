# ETSI TS 102 361 Specification Coverage Matrix
# Validated by cmd/speccheck — run: go run -C cmd/speccheck .
#
# test_functions maps spec sections to Go test functions.
# speccheck runs `go test -v -run <regex>` for each package and verifies pass.
#
# Out of scope: state machines, procedures, RF/physical layer, conformance testing.
#
# ignore_files lists Go source files under v2/ that implement no spec section.
# Every other non-test, non-generated Go file must appear in a section's source_files.

ignore_files:
  - v2/bit/bit.go
  - v2/examples/bridge/main.go
  - v2/examples/conformance/main.go
  - v2/examples/data/main.go
  - v2/examples/hotspot/main.go
  - v2/examples/scanner/main.go
