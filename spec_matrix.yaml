# ETSI TS 102 361 Specification Coverage Matrix
# cmd/speccheck checks this file. Run: go run -C cmd/speccheck .
#
# test_functions maps spec sections to Go test functions.
# speccheck runs `go test -v -run <regex>` for each package and verifies pass.
#
# Procedures and state machines are in scope. A clause that is only partly implemented is
# split into subclause rows, and a row with no source_files and no test_functions shows a
# procedure without code as unimplemented. A clause that is not listed is not claimed.
# Out of scope: the RF/physical layer and conformance testing.
#
# ignore_files lists Go source files of the v2 module that implement no spec section.
# Every other non-test, non-generated Go file except doc.go must appear in a section's source_files.
# Nested modules under v2/, such as the C API in v2/capi, are not checked.

