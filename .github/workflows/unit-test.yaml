name: Unit test

on:
  workflow_call:
    inputs:
      coverage:
        type: boolean
        description: 'Run coverage tests'
        required: false
        default: false
    secrets:
      app_key:
        description: 'Private key of the auto-commit GitHub App, which commits the coverage badge'
        required: false
      token:
        description: 'GitHub token'
        required: false

jobs:
  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: inputs.coverage
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.app_key }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - run: go generate ./...

      - name: Unit tests
        if: '!inputs.coverage'
        env:
          # renovate: datasource=go depName=github.com/jstemmer/go-junit-report/v2
          GO_JUNIT_REPORT_VERSION: v2.1.0
          # renovate: datasource=go depName=github.com/vakenbolt/go-test-report
          GO_TEST_REPORT_VERSION: v0.9.3
        run: |
          go install "github.com/jstemmer/go-junit-report/v2@${GO_JUNIT_REPORT_VERSION}"
          go install "github.com/vakenbolt/go-test-report@${GO_TEST_REPORT_VERSION}"
          env CGO_ENABLED=0 go test -C v2 -v ./... > out.txt 2>&1 && status=0 || status=$?
          env CGO_ENABLED=0 go test -C v2 -v ./... -json > json-out.txt && json_status=0 || json_status=$?
          cd v2
          go-junit-report -in ../out.txt -out ../report.xml -iocopy
          go-test-report -o ../report.html < ../json-out.txt
          if [ "$status" -ne 0 ] || [ "$json_status" -ne 0 ]; then
            echo "::error::go test failed (exit $status, json run exit $json_status)"
            exit 1
          fi

      - name: Unit tests coverage
        if: inputs.coverage
        run: |
          env CGO_ENABLED=0 go test -C v2 -v ./... -coverprofile ../coverage.out -coverpkg=./... -covermode atomic

      - uses: USA-RedDragon/reusable-actions/coverage@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
        if: always() && inputs.coverage
        with:
          file: coverage.out
          badge: .github/badges/coverage-v2.svg
          baseline: .github/coverage-baseline-v2.tsv
          label: v2 coverage
          marker: coverage-v2
          token: ${{ steps.app-token.outputs.token }}
          git-user-name: usa-reddragon-auto-commit-bot[bot]
          git-user-email: usa-reddragon-auto-commit-bot[bot]@users.noreply.github.com

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.coverage
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 30

      - name: Publish Test Report
        if: always() && !inputs.coverage
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: "report.xml"
          require_tests: true
          check_retries: true
          detailed_summary: true
          fail_on_failure: true
          token: ${{ secrets.token }}
          check_name: Unit Tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !inputs.coverage
        with:
          name: test-report-xml
          path: report.xml
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !inputs.coverage
        with:
          name: test-report-html
          path: report.html
          if-no-files-found: error
          retention-days: 30
