name: Unit test

on:
  workflow_call:
    inputs:
      coverage:
        type: boolean
        description: 'Run coverage tests'
        required: false
        default: false
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false
      token:
        description: 'GitHub token'
        required: false

jobs:
  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - run: go generate ./...

      - name: Unit tests
        if: '!inputs.coverage'
        env:
          # renovate: datasource=go depName=github.com/jstemmer/go-junit-report/v2
          GO_JUNIT_REPORT_VERSION: v2.1.0
          # renovate: datasource=go depName=github.com/vakenbolt/go-test-report
          GO_TEST_REPORT_VERSION: v0.9.3
        run: |
          go install "github.com/jstemmer/go-junit-report/v2@${GO_JUNIT_REPORT_VERSION}"
          go install "github.com/vakenbolt/go-test-report@${GO_TEST_REPORT_VERSION}"
          env CGO_ENABLED=0 go test -C v2 -v ./... > out.txt 2>&1 && status=0 || status=$?
          env CGO_ENABLED=0 go test -C v2 -v ./... -json > json-out.txt && json_status=0 || json_status=$?
          cd v2
          go-junit-report -in ../out.txt -out ../report.xml -iocopy
          go-test-report -o ../report.html < ../json-out.txt
          if [ "$status" -ne 0 ] || [ "$json_status" -ne 0 ]; then
            echo "::error::go test failed (exit $status, json run exit $json_status)"
            exit 1
          fi

      - name: Unit tests coverage
        if: inputs.coverage
        run: |
          env CGO_ENABLED=0 go test -C v2 -v ./... -coverprofile ../coverage.out -coverpkg=./... -covermode atomic

      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: always() && inputs.coverage
        with:
          token: ${{ secrets.codecov_token }}
          fail_ci_if_error: true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && inputs.coverage
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 30

      - name: Publish Test Report
        if: always() && !inputs.coverage
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: "report.xml"
          require_tests: true
          check_retries: true
          detailed_summary: true
          fail_on_failure: true
          token: ${{ secrets.token }}
          check_name: Unit Tests

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && !inputs.coverage
        with:
          name: test-report-xml
          path: report.xml
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && !inputs.coverage
        with:
          name: test-report-html
          path: report.html
          if-no-files-found: error
          retention-days: 30
