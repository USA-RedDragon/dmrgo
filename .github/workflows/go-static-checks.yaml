name: Go Static Checks
on: pull_request

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  golangci:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - v2
          - v2/capi
          - v2/internal/digest/xcrypto
          - cmd/dmrgen
          - cmd/speccheck
          - cmd/tablegen
          - examples/udp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install libcodec2
        if: matrix.module == 'v2' || matrix.module == 'v2/capi'
        run: sudo apt-get update && sudo apt-get install -y libcodec2-dev pkg-config
      - run: go generate ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0
          skip-cache: true
          only-new-issues: false
          working-directory: ${{ matrix.module }}
      - name: golangci-lint (tinygo build tag)
        if: matrix.module == 'v2'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.14.0
          skip-cache: true
          only-new-issues: false
          working-directory: ${{ matrix.module }}
          args: --build-tags tinygo

  lint:
    if: always()
    needs: golangci
    runs-on: ubuntu-24.04
    steps:
      - name: Check lint results
        run: test "${{ needs.golangci.result }}" = success

  generated:
    name: generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - name: Check generated files are up to date
        run: |
          git add --intent-to-add .
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'go generate ./...' and commit the result."
            exit 1
          fi
