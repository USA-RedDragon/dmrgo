name: Datasheets

on:
  push:
    branches:
      - main
    paths:
      - 'v2/rf/**'
      - 'v2/internal/fsktx/**'
      - 'v2/internal/rftx/**'
      - 'v2/layer2/**'
      - 'v2/go.mod'
      - 'v2/go.sum'
      - 'cmd/rxbench/**'
      - 'cmd/mcubench/**'
      - '.github/workflows/datasheet.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datasheet
  cancel-in-progress: false

env:
  # renovate: datasource=github-tags extractVersion=^v(?<version>\d+\.\d+\.\d+)$ depName=qemu/qemu
  QEMU_VERSION: 11.1.3
  QEMU_SIGNER: CEACC9E15534EBABB82D3FA03353C9CEF108B584
  TINYGO_IMAGE: tinygo/tinygo:0.44.0@sha256:98126534a0653966913b803d26805ea79250a244217d921d74044cfedc1d24a2

jobs:
  sweep:
    if: github.actor != 'usa-reddragon-auto-commit-bot[bot]'
    runs-on: ${{ vars.RXBENCH_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        shard: [audio3-0, audio3-1, audio3-2, audio3-3, audio3-4, audio3-5, audio3-6, audio3-7, audio3-8, audio3-9, audio3-10, audio3-11, audio3-12, audio3-13, audio3-14, audio3-15, audio3-16, floor-0, floor-1, floor-2, floor-3, floor-4, aware-0, aware-1, aware-2, aware-3, iq3-0, iq3-1, iq3-2, iq3-3, iq3-4, iq3-5, iq3-6, iq3-7, audio3, iq3, audio2, iq2, audio1, iq1, iqlow0, iq0, audio0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run the sweep of ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p out
          case "$SHARD" in
          floor-*|aware-*)
            DMRRF_FLOOR_SHARD="$SHARD" DMRRF_FLOOR_SHARD_OUT="$PWD/out/$SHARD.json" go test -C v2 -count=1 -run '^TestRxFloorShard$' -timeout 6h ./rf
            ;;
          *-*)
            DMRRF_RXBENCH_SHARD="$SHARD" DMRRF_RXBENCH_SHARD_OUT="$PWD/out/$SHARD.json" go test -C v2 -count=1 -run '^TestRxBenchShard$' -timeout 6h ./rf
            ;;
          audio3|iq3)
            DMRRF_RXBENCH=full DMRRF_RXBENCH_DEEP=off DMRRF_RXBENCH_TIERS="$SHARD" go test -C v2 -count=1 -run '^TestRxBench$' -timeout 6h ./rf
            cp v2/rf/testdata/rxbench.json "out/$SHARD.json"
            ;;
          *)
            DMRRF_RXBENCH=full DMRRF_RXBENCH_TIERS="$SHARD" go test -C v2 -count=1 -run '^TestRxBench$' -timeout 6h ./rf
            cp v2/rf/testdata/rxbench.json "out/$SHARD.json"
            ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-${{ matrix.shard }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  update:
    needs: sweep
    if: github.actor != 'usa-reddragon-auto-commit-bot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install TinyGo from the pinned image
        run: |
          cid=$(docker create "$TINYGO_IMAGE")
          docker cp "$cid:/usr/local/tinygo" "$RUNNER_TEMP/tinygo"
          docker rm "$cid"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"

      - name: Cache QEMU
        id: qemu-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qemu
          key: qemu-arm-plugins-${{ env.QEMU_VERSION }}

      - name: Build QEMU with plugin support
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libpixman-1-dev python3-venv flex bison
          curl -fsSLo qemu.tar.xz "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz"
          curl -fsSLo qemu.tar.xz.sig "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz.sig"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import .github/keys/qemu-release.asc
          status=$(gpg --batch --status-fd 1 --verify qemu.tar.xz.sig qemu.tar.xz)
          grep -q "^\[GNUPG:\] VALIDSIG ${QEMU_SIGNER} " <<<"$status"
          mkdir qemu-src
          tar -xf qemu.tar.xz -C qemu-src --strip-components=1
          cd qemu-src
          ./configure --prefix="$RUNNER_TEMP/qemu" --target-list=arm-softmmu --enable-plugins --disable-docs --disable-tools --disable-werror
          make -j"$(nproc)"
          make install

      - name: Put QEMU on the path
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libpixman-1-0 pkg-config
          echo "$RUNNER_TEMP/qemu/bin" >> "$GITHUB_PATH"
          echo "CPATH=$RUNNER_TEMP/qemu/include" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-*
          path: sweep
          merge-multiple: true

      - name: Merge the receiver sweep
        run: |
          DMRRF_FLOOR_MERGE="$PWD/sweep" go test -C v2 -count=1 -run '^TestRxFloorMerge$' ./rf
          DMRRF_RXBENCH_MERGE="$PWD/sweep" go test -C v2 -count=1 -run '^TestRxBenchMerge$' ./rf

      - name: Least sample rates
        run: DMRGO_LONG=1 go test -C v2 -count=1 -run '^TestMinRatesGenerated$' -timeout 3h ./internal/fsktx -args -update-minrate

      - name: Cortex-M4F cost
        run: go run -C cmd/mcubench . -update

      - name: Receiver datasheet
        run: go run -C cmd/rxbench . -update-readme -sheet

      - name: Transmitter datasheet
        run: go test -C v2 -count=1 -run '^TestTxDoc$' ./internal/fsktx -args -update-txdoc

      - name: Datasheet facts from the code
        run: DMRGO_DOCPARAMS=write go test -C v2 -count=1 -run '^TestDocParams$' ./rf

      - name: Check the generated datasheets
        run: |
          go run -C cmd/rxbench . -check-readme
          go test -C v2 -count=1 -run '^(TestTxDoc|TestDocParams|TestMinRates.*)$' ./rf ./internal/fsktx

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}

      - name: Commit the datasheets
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: usa-reddragon-auto-commit-bot[bot]
          GIT_AUTHOR_EMAIL: usa-reddragon-auto-commit-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: usa-reddragon-auto-commit-bot[bot]
          GIT_COMMITTER_EMAIL: usa-reddragon-auto-commit-bot[bot]@users.noreply.github.com
        run: |
          git add -A docs v2/rf/testdata v2/internal/fsktx/testdata v2/internal/fsktx/minrate_gen.go
          if git diff --cached --quiet; then
            echo "The datasheets are up to date."
            exit 0
          fi
          git commit -m "docs: regenerate the datasheets [skip ci]"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          for attempt in 1 2 3 4 5; do
            if git -c "http.https://github.com/.extraheader=${auth}" push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "main moved during the run (attempt ${attempt}); rebasing onto it"
            git -c "http.https://github.com/.extraheader=${auth}" fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "main kept moving; the datasheets were not pushed" >&2
          exit 1
