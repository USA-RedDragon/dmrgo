name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  checks:   write

jobs:
  benchmark-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go generate ./...

      - run: CGO_ENABLED=0 go test -C v2 -run ^$ -benchmem -bench=. ./...

  minimum-go-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: v2/go.mod

      - run: CGO_ENABLED=0 go test -C v2 -timeout 60m ./...

  js-wasm:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: v2/go.mod

      - name: Build for js/wasm
        run: GOOS=js GOARCH=wasm go build -C v2 ./...

      - name: Codec2 tests on the browser engine in Node
        run: GOOS=js GOARCH=wasm go test -C v2 -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./vocoder/codec2/

  arch-32bit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: v2/go.mod

      - name: Build and vet for arm
        run: GOARCH=arm CGO_ENABLED=0 go vet -C v2 ./...

      - name: Build and vet for 386
        run: GOARCH=386 CGO_ENABLED=0 go vet -C v2 ./...

      - name: Codec2 tests on 386
        run: GOARCH=386 CGO_ENABLED=0 go test -C v2 ./vocoder/codec2/...

      - name: Codec2 tests on amd64 with the translated engine
        run: CGO_ENABLED=0 go test -C v2 -tags codec2aot ./vocoder/codec2/...

      - name: Install qemu-user-static
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Codec2 allocation and engine tests on arm
        run: GOARCH=arm CGO_ENABLED=0 go test -C v2 -exec qemu-arm-static -run '^(TestAllocs|TestEnginesMatch|TestAOT)' ./vocoder/codec2/

  xcrypto-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: v2/internal/digest/xcrypto/go.mod

      - name: Compare BLAKE2b with golang.org/x/crypto
        run: CGO_ENABLED=0 go test -C v2/internal/digest/xcrypto ./...

  examples-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test the UDP example
        run: go test -C v2/examples/udp -race ./...

      - name: Test the TCP example
        run: go test -C v2/examples/tcp ./...

  race-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install libcodec2
        run: sudo apt-get update && sudo apt-get install -y libcodec2-dev pkg-config codec2

      - run: go generate ./...

      - name: Race tests
        run: go test -C v2 -timeout 60m ./... -race

      - name: Check the allocation table of docs/allocation.md against the gate
        run: DMRGO_README=check go test -C v2 -run TestHeapAllocations ./internal/allocgate

  codec2-backends:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go generate ./...

      - name: Build and test the default backend with cgo and without libcodec2
        run: |
          mkdir -p "$RUNNER_TEMP/no-pkgconfig"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/no-pkgconfig" PKG_CONFIG_LIBDIR="$RUNNER_TEMP/no-pkgconfig"
          if pkg-config --exists codec2; then echo "::error::pkg-config still finds codec2"; exit 1; fi
          CGO_ENABLED=1 go build -C v2 ./...
          CGO_ENABLED=1 go test -C v2 ./vocoder/codec2/... ./examples/transcoder/...

      - name: Install libcodec2
        run: sudo apt-get update && sudo apt-get install -y libcodec2-dev pkg-config codec2

      - name: Test the native backend
        run: |
          CGO_ENABLED=1 go vet -C v2 -tags codec2native ./...
          CGO_ENABLED=1 go test -C v2 -tags codec2native -race ./vocoder/codec2/... ./examples/transcoder/...

  abi-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the release tag rule of the C ABI lock
        run: bash .github/scripts/abi-release_test.sh

      - name: Fail a release tag while the C ABI lock is a prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/abi-release.sh "$GITHUB_REF_NAME" v2/capi/abi.txt

  capi:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install libcodec2
        run: sudo apt-get update && sudo apt-get install -y libcodec2-dev pkg-config

      - run: go generate ./...

      - name: Go tests of the C API
        run: go test -C v2/capi -race ./...

      - name: Build libdmrgo and run the C test program
        run: make -C v2/capi test

      - name: Build libdmrgo with the native Codec2 backend and run the C test program
        run: GOFLAGS=-tags=codec2native make -C v2/capi BUILD=build-native test

      - name: Build libdmrgo without libcodec2
        run: go build -C v2/capi -tags nocodec2 -buildmode=c-shared -o build/libdmrgo-nocodec2.so .

  tinygo:
    runs-on: ubuntu-24.04
    container:
      image: tinygo/tinygo:0.44.0@sha256:98126534a0653966913b803d26805ea79250a244217d921d74044cfedc1d24a2
      options: --user root
    # The runner, not root, owns the workspace, so git refuses its status
    # for the VCS stamp of go list and tinygo.
    env:
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the example
        run: |
          tinygo build -target=pico -size short -o tinygo-pico.uf2 ./examples/tinygo
          for target in pico2 esp32c3-generic wasip1; do
            tinygo build -target="$target" -o "tinygo-$target.elf" ./examples/tinygo
          done

      - name: Build the receiver and modulator examples for WebAssembly
        run: |
          for target in wasm wasip1; do
            for example in rxaudio txaudio txiq; do
              tinygo build -target="$target" -o "$example-$target.wasm" "./examples/$example"
            done
          done

      - name: Build the Tier 0 receiver example without a heap
        run: tinygo build -target=feather-m4 -serial=uart -gc=none -scheduler=none -size short -o rxaudio.elf ./examples/rxaudio

      - name: Build the Tier 0 modulator examples without a heap
        run: |
          tinygo build -target=feather-m4 -serial=uart -gc=none -scheduler=none -size short -o txaudio.elf ./examples/txaudio
          tinygo build -target=feather-m4 -serial=uart -gc=none -scheduler=none -size short -o txiq.elf ./examples/txiq

      - name: Test the library
        run: tinygo test $(go list ./... | grep -v -e /cmd/ -e /examples/ -e /rf$) ./examples/tinygo

      - name: Test the example at the pico stack size
        run: tinygo test -stack-size=8KB ./examples/tinygo

      - name: Test the allocations at the pico stack size and collector
        run: |
          tinygo test -gc=conservative ./internal/allocs
          tinygo test -stack-size=8KB -gc=conservative ./internal/allocs

      - name: Check the heap allocation sites of the whole API for the pico and riscv-qemu
        run: DMRGO_TINYGO_ALLOCS=1 go test -run 'TestTinyGoHeapAllocations|TestTinyGoTablesInFlash' -v ./internal/allocgate

  unit-tests:
    uses: ./.github/workflows/unit-test.yaml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  unit-tests-coverage:
    uses: ./.github/workflows/unit-test.yaml
    permissions:
      contents: write
      pull-requests: write
      checks: write
    with:
      coverage: true
    secrets:
      app_key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      token: ${{ secrets.GITHUB_TOKEN }}
