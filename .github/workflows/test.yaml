name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks:   write

jobs:
  benchmark-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - run: go generate ./...

      - run: CGO_ENABLED=0 go test -C v2 -run ^$ -benchmem -bench=. ./...

  minimum-go-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: v2/go.mod

      - run: CGO_ENABLED=0 go test -C v2 ./...

  race-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install libcodec2
        run: sudo apt-get update && sudo apt-get install -y libcodec2-dev pkg-config codec2

      - run: go generate ./...

      - name: Race tests
        run: go test -C v2 ./... -race

  unit-tests:
    uses: ./.github/workflows/unit-test.yaml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  unit-tests-coverage:
    uses: ./.github/workflows/unit-test.yaml
    permissions:
      contents: write
      pull-requests: write
      checks: write
    with:
      coverage: true
    secrets:
      app_key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      token: ${{ secrets.GITHUB_TOKEN }}
