name: Spec Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  spec-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go generate ./...

      - name: Spec check validation
        run: env CGO_ENABLED=0 go run -C cmd/speccheck . -check-readme

  update-readme:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go generate ./...

      - name: Spec check and update docs/etsi.md
        run: env CGO_ENABLED=0 go run -C cmd/speccheck . -update-readme

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Update ETSI TS 102 361 specification coverage"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: docs/etsi.md
